# Render Blueprint for SkillBridge: one free backend (Express + SQLite) and one
# free static frontend (Vite + React). Put this file in the ROOT of the repo.
#
# Render prompts for every variable marked `sync: false` when you create the
# Blueprint, so no secrets are stored in this file.

services:
  # ---- Backend API -------------------------------------------------------
  - type: web
    name: skillbridge-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      # better-sqlite3 has prebuilt binaries for Node 20/22, not Node 24.
      - key: NODE_VERSION
        value: "22"
      # Password for the seeded "admin" account. Pick a long random one.
      - key: ADMIN_PASSWORD
        sync: false
      # Keys that outside consumers send in the X-API-Key header, written
      # name:key and comma separated, e.g. agroconnect:<key>,team:<key>.
      # Generate each with: node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      - key: API_KEYS
        sync: false
      # The key our own frontend sends (same value as VITE_API_KEY below).
      - key: WEB_API_KEY
        sync: false
      # Render sits behind one proxy; this lets the rate limiter see real visitor addresses.
      - key: TRUST_PROXY
        value: "1"
      # The frontend's address, e.g. https://skillbridge-web.onrender.com
      # (no trailing slash). Lets only your site call the API from a browser.
      - key: ALLOWED_ORIGIN
        sync: false

  # ---- Frontend ----------------------------------------------------------
  - type: web
    name: skillbridge-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The backend's address ending in /api, e.g.
      # https://skillbridge-api.onrender.com/api (baked in at build time).
      - key: VITE_API_URL
        sync: false
      # Same value as the API's WEB_API_KEY (baked in at build time).
      - key: VITE_API_KEY
        sync: false
